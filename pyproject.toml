[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-pick"
dynamic = ["version"]
description = "Local single-player loot helper for Dying Light: The Beast"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "hyhacct"}]
requires-python = ">=3.12"
dependencies = ["frida==17.24.0", "PySide6==6.12.0"]

[project.urls]
Homepage = "https://github.com/hyhacct/beast-pick"
Repository = "https://github.com/hyhacct/beast-pick"
Issues = "https://github.com/hyhacct/beast-pick/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "pefile>=2024.8.26", "capstone>=5,<6"]

[project.scripts]
beast-pick = "beast_pick.app:main"

[tool.setuptools.packages.find]
include = ["beast_pick*"]

[tool.setuptools.dynamic]
version = {attr = "beast_pick.__version__"}

[tool.setuptools.package-data]
beast_pick = ["*.js", "profiles/*.json", "data/*.json"]
