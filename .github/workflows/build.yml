name: Windows build

on:
  workflow_call:
    inputs:
      expected-tag:
        description: Release tag to compare with the package version
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: Validated package version
        value: ${{ jobs.windows.outputs.version }}

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Validate version and changelog
        id: version
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: |
          if ($env:EXPECTED_TAG) {
            .\.venv\Scripts\python.exe tools\release.py check --tag $env:EXPECTED_TAG
          } else {
            .\.venv\Scripts\python.exe tools\release.py check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseVersion = .\.venv\Scripts\python.exe tools\release.py version
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
      - name: Test Python and JavaScript
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests\agent.test.cjs tests\filters.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check beast_pick\agent.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and check the actual EXE
        shell: pwsh
        run: .\build.ps1
      - name: Create download package and checksums
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools\package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: beast-pick-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beast-pick-build-diagnostics
          path: |
            artifacts/packaged-self-check.json
            build/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 7
