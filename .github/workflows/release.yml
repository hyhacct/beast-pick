name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      expected-tag: ${{ github.ref_name }}
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beast-pick-windows-x64
          path: release
      - name: Verify package checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish version and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Beast Pick (BP) $RELEASE_TAG — Dying Light: The Beast Auto Loot" \
            --notes-file release/RELEASE_NOTES.md \
            --draft \
            release/BP.exe release/BP-v*.zip release/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
